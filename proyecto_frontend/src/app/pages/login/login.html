<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-circle">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </div>
      <h2>Distribuidora La Dorada</h2>
      <p class="subtitulo">Ingresa tus credenciales para acceder al sistema</p>
    </div>

    @if (errorMensaje()) {
      <div class="alerta-error">
        <span>{{ errorMensaje() }}</span>
      </div>
    }

    <form (ngSubmit)="iniciarSesion()" class="login-form">
      <div class="campo">
        <label for="id_usuario">ID de Usuario</label>
        <input
          id="id_usuario"
          type="number"
          name="id_usuario"
          [(ngModel)]="id_usuario"
          placeholder="Ej: 1"
          min="1"
          (keydown)="bloquearSignoMenos($event)"
          required
          [disabled]="cargando()"
        />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresa tu contraseña"
          required
          [disabled]="cargando()"
        />
      </div>

      <button type="submit" class="btn-ingresar" [disabled]="cargando()">
        @if (cargando()) {
          <span class="spinner"></span> Iniciando sesión...
        } @else {
          Ingresar al Sistema
        }
      </button>
    </form>
  </div>
</div>
