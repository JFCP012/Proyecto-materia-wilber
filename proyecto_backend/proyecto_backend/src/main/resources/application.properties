spring.application.name=proyecto_backend

# ==========================================
# CONFIGURACIÓN DEL SERVIDOR
# ==========================================
server.port=8080

# ==========================================
# CONEXIÓN A POSTGRESQL
# ==========================================
# Cambia 'nombre_de_tu_bd' por el nombre real de tu base de datos en PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ProyectoBd
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACIÓN JPA / HIBERNATE
# ==========================================
# Opciones para ddl-auto:
#   update: actualiza las tablas sin borrar los datos existentes (recomendado para desarrollo)
#   create: crea las tablas desde cero cada vez que inicia la app (borra los datos)
#   none / validate: no altera las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# Mostrar las sentencias SQL en la consola y formatearlas para que sean legibles
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
